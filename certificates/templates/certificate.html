<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <style>
        @page {
            size: A4 landscape;
            margin: 40px;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-top: 45px;
        }

        .subtitle {
            font-size: 22px;
            letter-spacing: 4px;
            margin-top: 10px;
        }

        .line {
            width: 500px;
            border-top: 2px solid #555555;
            margin: 25px auto;
        }

        .text {
            font-size: 18px;
            margin-top: 35px;
        }

        .name {
            font-size: 36px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .event {
            font-size: 26px;
            font-weight: bold;
            margin-top: 15px;
        }

        .footer {
            margin-top: 70px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .footer td {
            width: 50%;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="title">
        CERTIFICATE
    </div>

    <div class="subtitle">
        OF PARTICIPATION
    </div>

    <div class="line"></div>

    <div class="text">
        This is to proudly certify that
    </div>

    <div class="name">
        {{ name }}
    </div>

    <div class="text">
        has successfully participated in
    </div>

    <div class="event">
        {{ event_name }}
    </div>

    <table class="footer">
        <tr>
            <td>
                ____________________<br><br>
                Date
            </td>

            <td>
                ____________________<br><br>
                Authorized Signature
            </td>
        </tr>
    </table>

</body>
</html>
